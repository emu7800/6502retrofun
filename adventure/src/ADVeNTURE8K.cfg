SYMBOLS {
    __STACKSIZE__: type = weak, value = $001a;  # 26 bytes stack size, 13 frames
}
MEMORY {
    RAM:  file = "", start = $0080, size = $0080 - __STACKSIZE__, define = yes;
    ROM0: file = %O, start = $1000, size = $1000, fill = yes, fillval = $00;
    ROM1: file = %O, start = $1000, size = $1000, fill = yes, fillval = $00;
}
SEGMENTS {
    ZEROPAGE: load = RAM,  type = zp;
    CODE0:    load = ROM0, type = ro;
    VECTORS0: load = ROM0, type = overwrite, start = $2000 - $2c; # $2c = segment length
    CODE1:    load = ROM1, type = ro;
    VECTORS1: load = ROM1, type = overwrite, start = $2000 - $2c; # $2c = segment length
}
