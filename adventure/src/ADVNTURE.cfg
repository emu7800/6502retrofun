FEATURES {
    STARTADDRESS: default = $f000;
}
SYMBOLS {
    __LOADADDR__: type = weak, value = %S;
}
MEMORY {
    MAIN:     file = %O, start = %S,     size = $fffa - %S, fill = yes, fillval = $00;
    VECTORS:  file = %O, start = $fffa,  size = 6;
}
SEGMENTS {
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro,  optional = yes;
    VECTORS:  load = VECTORS,  type = ro;
}
