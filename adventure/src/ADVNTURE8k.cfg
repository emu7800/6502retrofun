SYMBOLS {
    __STACKSIZE__: type = weak, value = $0018;  # 24 bytes stack size, 12 frames
}
MEMORY {
    RAM:  file = "", start = $0080, size = $0080 - __STACKSIZE__, define = yes;
    ROM0: file = %O, start = $f000, size = $1000, fill = yes, fillval = $00;
    ROM1: file = %O, start = $f000, size = $1000, fill = yes, fillval = $00;
}
SEGMENTS {
    ZEROPAGE: load = RAM,  type = zp;
    CODE:     load = ROM0, type = ro;
    CODE1:    load = ROM1, type = ro;
    RODATA:   load = ROM0, type = ro, optional = yes;
    RODATA1:  load = ROM1, type = ro, optional = yes;
    VECTORS:  load = ROM0, type = ro, start = $fffa;
    VECTORS1: load = ROM1, type = ro, start = $fffa;
}
