SYMBOLS {
    __STACKSIZE__: type = weak, value = $0018;  # 24 bytes stack size, 12 frames
}
MEMORY {
    RAM: file = "", start = $0080, size = $0080 - __STACKSIZE__, define = yes;
    ROM: file = %O, start = $1000, size = $2000, fill = yes, fillval = $00, type = ro;
}
SEGMENTS {
    ZEROPAGE: load = RAM, type = zp;
    CODE0:    load = ROM, type = ro;
    VECTORS0: load = ROM, type = overwrite, start = $1fde;
    CODE1:    load = ROM, type = overwrite, start = $2000;
    VECTORS1: load = ROM, type = overwrite, start = $2fde;
}
